<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล้องสแกนใบหน้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1e293b; color: white; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #camera-container { position: relative; width: 100%; max-width: 500px; border: 4px solid #3b82f6; border-radius: 12px; background-color: #0f172a; overflow: hidden; }
        #videoElement { width: 100%; display: block; transform: scaleX(-1); /* ค่าเริ่มต้นคือกล้องหน้า ให้เป็นกระจก */ }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .status { margin-top: 20px; padding: 10px 20px; border-radius: 8px; background-color: #0369a1; font-size: 1.2rem; transition: background-color 0.3s; }
        .btn-register { margin-top: 15px; padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; display: none; }
        
        /* สไตล์สำหรับปุ่มสลับกล้อง */
        .btn-switch { margin-top: 15px; padding: 10px 20px; background: #475569; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
        .btn-switch:hover { background: #64748b; }
    </style>
</head>
<body>

    <h2 id="pageTitle">ระบบ AI สแกนใบหน้า</h2>
    <div id="camera-container">
        <video id="videoElement" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    
    <div id="statusMessage" class="status">กำลังโหลดระบบ...</div>
    
    <button id="btnSwitch" class="btn-switch" onclick="switchCamera()">🔄 สลับกล้อง (หน้า/หลัง)</button>
    <button id="btnCapture" class="btn-register" onclick="captureAndRegister()">📸 บันทึกใบหน้านี้</button>

    <script>
        const video = document.getElementById('videoElement');
        const overlay = document.getElementById('overlay');
        const statusMsg = document.getElementById('statusMessage');
        const btnCapture = document.getElementById('btnCapture');
        
        let currentMode = 'scan'; 
        let targetStudentId = '';
        let faceDescriptorsDB = []; 
        let lastMatchedId = '';
        let matchTimeout = null;
        const nameMap = new Map();

        // ตัวแปรสำหรับจัดการกล้อง
        let currentFacingMode = 'user'; // 'user' = กล้องหน้า, 'environment' = กล้องหลัง
        let isPlayEventAttached = false; // ป้องกัน Event ทำงานซ้ำซ้อนตอนสลับกล้อง

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'register') {
            currentMode = 'register';
            targetStudentId = urlParams.get('studentId');
            document.getElementById('pageTitle').innerText = `ลงทะเบียนใบหน้า: รหัส ${targetStudentId}`;
        }

        async function loadModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                statusMsg.innerText = 'โหลด AI สำเร็จ กำลังเปิดกล้อง...';
                startCamera();
            } catch (err) {
                statusMsg.innerText = 'เกิดข้อผิดพลาด: ' + err.message;
            }
        }

        async function startCamera() {
            try {
                // ปิดกล้องเก่าก่อนเปิดกล้องใหม่ (กรณีสลับกล้อง)
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;

                // จัดการการสะท้อนกระจก: กล้องหน้าให้กลับซ้ายขวา กล้องหลังให้แสดงปกติ
                if (currentFacingMode === 'user') {
                    video.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'scaleX(1)';
                }

            } catch (err) {
                statusMsg.innerText = 'ไม่สามารถเข้าถึงกล้องได้: ' + err.message;
            }
        }

        // ฟังก์ชันสำหรับปุ่มสลับกล้อง
        function switchCamera() {
            // สลับโหมด
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera();
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);

            // ใช้ isPlayEventAttached เช็คเพื่อไม่ให้ผูก Event ซ้ำเวลาสลับกล้อง
            if (!isPlayEventAttached) {
                isPlayEventAttached = true;
                
                if (currentMode === 'register') {
                    btnCapture.style.display = 'block';
                } else {
                    window.addEventListener('message', (event) => {
                        if (event.data && event.data.action === 'loadFaceData') {
                            event.data.faces.forEach(f => nameMap.set(f.studentId, f.studentName));
                            faceDescriptorsDB = event.data.faces.map(f => new faceapi.LabeledFaceDescriptors(f.studentId, [new Float32Array(Object.values(f.descriptor))]));
                            startScan(displaySize);
                        }
                    });
                    if (window.opener) window.opener.postMessage({ action: 'scannerReady' }, '*');
                }
            }
        });

        async function captureAndRegister() {
            btnCapture.disabled = true;
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if (!detection) { statusMsg.innerText = 'ไม่พบใบหน้า'; btnCapture.disabled = false; return; }
            window.opener.postMessage({ action: 'faceRegistered', studentId: targetStudentId, descriptor: Array.from(detection.descriptor) }, '*');
            statusMsg.innerText = 'บันทึกเรียบร้อย!';
            setTimeout(() => window.close(), 1500);
        }

        async function startScan(displaySize) {
            const faceMatcher = new faceapi.FaceMatcher(faceDescriptorsDB, 0.55); 
            statusMsg.innerText = 'กำลังสแกนใบหน้า...';
            
            setInterval(async () => {
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                if (!detection) return;
                
                const match = faceMatcher.findBestMatch(detection.descriptor);
                if (match.label !== 'unknown') {
                    if (window.opener) window.opener.postMessage({ action: 'faceMatched', studentId: match.label }, '*');
                    
                    if (lastMatchedId !== match.label) {
                        lastMatchedId = match.label;
                        const studentName = nameMap.get(match.label) || match.label;
                        statusMsg.innerText = `✅ สแกนสำเร็จ: ${studentName}`;
                        statusMsg.style.backgroundColor = '#15803d';
                        clearTimeout(matchTimeout);
                        matchTimeout = setTimeout(() => { statusMsg.innerText = 'กำลังสแกน...'; statusMsg.style.backgroundColor = '#0369a1'; lastMatchedId = ''; }, 2000);
                    }
                }
            }, 300); // ตรวจสอบทุก 300ms เพื่อความลื่นไหล
        }

        window.addEventListener('DOMContentLoaded', loadModels);
    </script>
</body>
</html>
