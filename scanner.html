<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล้องสแกนใบหน้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #1e293b;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            background-color: #0f172a;
            overflow: hidden;
        }
        #videoElement {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* สลับซ้ายขวาให้เป็นกระจก */
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* สลับ Canvas ให้ตรงกับวิดีโอ */
        }
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #334155;
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }
        .btn-register {
            margin-top: 15px;
            padding: 10px 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <h2 id="pageTitle">ระบบ AI สแกนใบหน้า</h2>
    <div id="camera-container">
        <video id="videoElement" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    
    <div id="statusMessage" class="status">กำลังโหลดโมเดล AI... (อาจใช้เวลาสักครู่)</div>
    <button id="btnCapture" class="btn-register" onclick="captureAndRegister()">📸 บันทึกใบหน้านี้</button>

    <script>
        const video = document.getElementById('videoElement');
        const overlay = document.getElementById('overlay');
        const statusMsg = document.getElementById('statusMessage');
        const btnCapture = document.getElementById('btnCapture');
        
        let currentMode = 'scan'; 
        let targetStudentId = '';
        let faceDescriptorsDB = []; 
        
        let lastMatchedId = '';
        let matchTimeout = null;
        let hasBlinked = false;
        const nameMap = new Map();

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'register') {
            currentMode = 'register';
            targetStudentId = urlParams.get('studentId');
            document.getElementById('pageTitle').innerText = `ลงทะเบียนใบหน้า: รหัส ${targetStudentId}`;
        }

        async function loadModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                statusMsg.innerText = 'โหลด AI สำเร็จ กำลังเปิดกล้อง...';
                statusMsg.style.backgroundColor = '#0369a1';
                startCamera();
            } catch (err) {
                statusMsg.innerText = 'เกิดข้อผิดพลาดในการโหลดโมเดล: ' + err.message;
                statusMsg.style.backgroundColor = '#b91c1c';
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
            } catch (err) {
                statusMsg.innerText = 'ไม่สามารถเข้าถึงกล้องได้: ' + err.message;
                statusMsg.style.backgroundColor = '#b91c1c';
            }
        }

        video.addEventListener('play', () => {
            statusMsg.innerText = currentMode === 'register' ? 'กรุณามองกล้องให้ชัดเจน แล้วกดปุ่มบันทึก' : 'กำลังเตรียมระบบสแกน...';
            statusMsg.style.backgroundColor = '#0369a1';
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);

            if (currentMode === 'register') {
                btnCapture.style.display = 'block';
            } else {
                window.addEventListener('message', (event) => {
                    if (event.data && event.data.action === 'loadFaceData') {
                        statusMsg.innerText = 'กำลังสแกนใบหน้า...';
                        
                        event.data.faces.forEach(f => {
                            if (f.studentName) nameMap.set(f.studentId, f.studentName);
                        });

                        faceDescriptorsDB = event.data.faces.map(f => {
                            return new faceapi.LabeledFaceDescriptors(
                                f.studentId,
                                [new Float32Array(Object.values(f.descriptor))]
                            );
                        });
                        startContinuousScan(displaySize);
                    }
                });
                if (window.opener) window.opener.postMessage({ action: 'scannerReady' }, '*');
            }
        });

        async function captureAndRegister() {
            statusMsg.innerText = 'กำลังประมวลผลใบหน้า...';
            statusMsg.style.backgroundColor = '#ca8a04';
            btnCapture.disabled = true;

            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                           .withFaceLandmarks()
                                           .withFaceDescriptor(); 
            
            if (!detection) {
                statusMsg.innerText = 'ไม่พบใบหน้า กรุณาขยับหน้าให้อยู่ในกรอบ หรือเพิ่มแสงสว่าง';
                statusMsg.style.backgroundColor = '#b91c1c';
                btnCapture.disabled = false;
                return;
            }

            const descriptorArray = Array.from(detection.descriptor);
            
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    action: 'faceRegistered',
                    studentId: targetStudentId,
                    descriptor: descriptorArray
                }, '*');
                
                statusMsg.innerText = 'บันทึกใบหน้าสำเร็จ! กำลังปิดหน้าต่าง...';
                statusMsg.style.backgroundColor = '#15803d';
                setTimeout(() => window.close(), 1500);
            } else {
                statusMsg.innerText = 'ไม่พบการเชื่อมต่อกับระบบหลัก';
                statusMsg.style.backgroundColor = '#b91c1c';
            }
        }

        // สูตรคำนวณอัตราส่วนการลืมตา (EAR)
        function getEAR(eyePoints) {
            const v1 = Math.hypot(eyePoints[1].x - eyePoints[5].x, eyePoints[1].y - eyePoints[5].y);
            const v2 = Math.hypot(eyePoints[2].x - eyePoints[4].x, eyePoints[2].y - eyePoints[4].y);
            const h = Math.hypot(eyePoints[0].x - eyePoints[3].x, eyePoints[0].y - eyePoints[3].y);
            return (v1 + v2) / (2.0 * h);
        }

        async function startContinuousScan(displaySize) {
            if (faceDescriptorsDB.length === 0) {
                statusMsg.innerText = 'ยังไม่มีข้อมูลใบหน้าในระบบของห้องนี้';
                statusMsg.style.backgroundColor = '#b91c1c';
                return;
            }

            const faceMatcher = new faceapi.FaceMatcher(faceDescriptorsDB, 0.55); 
            
            let isDetecting = false; // ป้องกันการคำนวณซ้อนทับกัน

            // *** แก้ไข: ลดเวลาจาก 1000ms เหลือ 200ms เพื่อจับภาพการกระพริบตาให้ทัน! ***
            setInterval(async () => {
                if (isDetecting) return;
                isDetecting = true;

                try {
                    const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                                                    .withFaceLandmarks()
                                                    .withFaceDescriptors();
                    
                    const resizedDetections = faceapi.resizeResults(detections, displaySize);
                    const ctx = overlay.getContext('2d');
                    ctx.clearRect(0, 0, overlay.width, overlay.height);

                    if (detections.length === 0) {
                        hasBlinked = false; 
                    }
                    
                    resizedDetections.forEach(detection => {
                        const match = faceMatcher.findBestMatch(detection.descriptor);
                        const studentName = nameMap.get(match.label) || match.label;
                        const displayLabel = match.label !== 'unknown' ? studentName : 'Unknown';
                        
                        const box = detection.detection.box;

                        // *** แก้ไข: วาดกล่องเปล่าๆ ซ่อนชื่อที่กลับด้านเอาไว้ ***
                        const drawBox = new faceapi.draw.DrawBox(box, { label: '' }); 
                        drawBox.draw(overlay);

                        // *** แก้ไข: วาดชื่อเองแบบพลิกกลับให้อ่านได้ปกติ ***
                        ctx.save();
                        ctx.scale(-1, 1); // พลิกแกน X เพื่อแก้ผลจาก scaleX(-1) ใน CSS
                        ctx.font = 'bold 16px Sarabun';
                        const textWidth = ctx.measureText(displayLabel).width;
                        const padding = 4;
                        // คำนวณพิกัดใหม่บนแกนที่โดนพลิกกลับ
                        const flipX = -box.x - box.width; 
                        
                        ctx.fillStyle = 'rgba(37, 99, 235, 0.9)'; // สีพื้นหลังป้ายชื่อ
                        ctx.fillRect(flipX, box.y - 24, textWidth + (padding * 2), 24);
                        ctx.fillStyle = '#ffffff'; // สีตัวอักษร
                        ctx.fillText(displayLabel, flipX + padding, box.y - 6);
                        ctx.restore();

                        // Liveness Detection (ตรวจสอบการกระพริบตา)
                        const landmarks = detection.landmarks;
                        const leftEye = landmarks.getLeftEye();
                        const rightEye = landmarks.getRightEye();
                        
                        const leftEAR = getEAR(leftEye);
                        const rightEAR = getEAR(rightEye);
                        const avgEAR = (leftEAR + rightEAR) / 2;

                        // ปรับค่าเป็น 0.26 ให้จับการกระพริบตาง่ายขึ้น (ไม่ต้องหลับตาแน่นก็จับได้)
                        if (avgEAR < 0.26) { 
                            hasBlinked = true;
                        }

                        if (match.label !== 'unknown') {
                            if (hasBlinked) {
                                if (window.opener) {
                                    window.opener.postMessage({
                                        action: 'faceMatched',
                                        studentId: match.label
                                    }, '*');
                                }
                                
                                if (lastMatchedId !== match.label) {
                                    lastMatchedId = match.label;
                                    statusMsg.innerText = `✅ สแกนสำเร็จ: ${studentName}`;
                                    statusMsg.style.backgroundColor = '#15803d'; 
                                    
                                    clearTimeout(matchTimeout);
                                    matchTimeout = setTimeout(() => {
                                        statusMsg.innerText = 'กำลังสแกนใบหน้า...';
                                        statusMsg.style.backgroundColor = '#0369a1'; 
                                        lastMatchedId = ''; 
                                        hasBlinked = false; // รีเซ็ตให้นักเรียนคนต่อไป
                                    }, 2500); 
                                }
                            } else {
                                if (lastMatchedId !== match.label) {
                                    statusMsg.innerText = `📸 พบคุณ ${studentName} กรุณากระพริบตายืนยัน...`;
                                    statusMsg.style.backgroundColor = '#ca8a04'; 
                                }
                            }
                        }
                    });
                } finally {
                    isDetecting = false; // ปลดล็อคให้รอบถัดไปทำงานได้
                }
            }, 200); // <-- ความเร็วอยู่ที่นี่ (ตรวจจับทุกๆ 0.2 วินาที)
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof faceapi === 'undefined') {
                statusMsg.innerText = 'โหลดไลบรารี AI ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ';
                statusMsg.style.backgroundColor = '#b91c1c';
            } else {
                loadModels();
            }
        });
    </script>
</body>
</html>
