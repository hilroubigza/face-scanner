<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบสแกนใบหน้า</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #1e293b; color: white; text-align: center; padding: 20px; }
        #camera-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border: 4px solid #3b82f6; border-radius: 12px; overflow: hidden; }
        #videoElement { width: 100%; display: block; transform: scaleX(-1); }
        .status { margin-top: 20px; padding: 15px; border-radius: 8px; background-color: #334155; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h2>ระบบ AI สแกนใบหน้า</h2>
    <div id="camera-container">
        <video id="videoElement" autoplay muted playsinline></video>
    </div>
    <div id="statusMessage" class="status">เริ่มโหลดระบบ...</div>

    <script>
        const video = document.getElementById('videoElement');
        const statusMsg = document.getElementById('statusMessage');
        let faceDescriptorsDB = [];

        async function init() {
            statusMsg.innerText = "กำลังโหลดโมเดล AI...";
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                statusMsg.innerText = "โหลด AI เสร็จสิ้น กำลังเปิดกล้อง...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
            } catch (e) {
                statusMsg.innerText = "Error: " + e.message;
            }
        }

        // เมื่อกล้องเปิดแล้ว ให้ส่งสัญญาณบอกหน้าหลักว่า "พร้อมรับข้อมูล"
        video.addEventListener('play', () => {
            statusMsg.innerText = "กำลังเชื่อมต่อกับหน้าเช็คชื่อ...";
            if (window.opener) {
                window.opener.postMessage({ action: 'scannerReady' }, '*');
            } else {
                statusMsg.innerText = "Error: ไม่พบหน้าต่างหลัก";
            }
        });

        // รับข้อมูลนักเรียนจากหน้าหลัก
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'loadFaceData') {
                statusMsg.innerText = `ได้รับข้อมูลนักเรียน ${event.data.faces.length} คน กำลังเริ่มสแกน...`;
                faceDescriptorsDB = event.data.faces.map(f => new faceapi.LabeledFaceDescriptors(f.studentId, [new Float32Array(Object.values(f.descriptor))]));
                startScan();
            }
        });

        async function startScan() {
            const faceMatcher = new faceapi.FaceMatcher(faceDescriptorsDB, 0.55);
            setInterval(async () => {
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                if (!detection) return;
                
                const match = faceMatcher.findBestMatch(detection.descriptor);
                if (match.label !== 'unknown') {
                    if (window.opener) {
                        window.opener.postMessage({ action: 'faceMatched', studentId: match.label }, '*');
                    }
                    statusMsg.innerText = "✅ สแกนสำเร็จ: " + match.label;
                    statusMsg.style.backgroundColor = "#15803d";
                }
            }, 1000);
        }

        init();
    </script>
</body>
</html>
