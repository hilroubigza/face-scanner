<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e293b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #v { width: 90%; max-width: 400px; border: 3px solid #3b82f6; border-radius: 8px; }
        #msg { margin-top: 15px; padding: 10px; background: #0369a1; border-radius: 5px; width: 90%; text-align: center; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <div id="msg">กำลังเตรียมกล้องและ AI...</div>

    <script>
        const v = document.getElementById('v');
        const msg = document.getElementById('msg');
        
        async function init() {
            try {
                // 1. เปิดกล้องก่อน
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                v.srcObject = stream;
                msg.innerText = 'โหลด AI...';

                // 2. โหลดโมเดล
                await faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights');
                msg.innerText = 'ระบบพร้อมใช้งาน!';
                
                // 3. เริ่มสแกน QR
                setInterval(scanQR, 500);
            } catch(e) { msg.innerText = 'Error: ' + e.message; }
        }

        function scanQR() {
            const canvas = document.createElement('canvas');
            canvas.width = v.videoWidth; canvas.height = v.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(v, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(data.data, data.width, data.height);
            if (code) {
                if(window.opener) window.opener.postMessage({action: 'faceMatched', studentId: code.data.trim()}, '*');
                msg.innerText = 'พบ QR: ' + code.data;
            }
        }
        init();
    </script>
</body>
</html>
