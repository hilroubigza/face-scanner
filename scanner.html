<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล้องสแกนใบหน้า & QR Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1e293b; color: white; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #camera-container { position: relative; width: 100%; max-width: 500px; border: 4px solid #3b82f6; border-radius: 12px; background-color: #0f172a; overflow: hidden; }
        #videoElement { width: 100%; display: block; transform: scaleX(-1); }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .status { margin-top: 20px; padding: 10px 20px; border-radius: 8px; background-color: #0369a1; font-size: 1.2rem; transition: background-color 0.3s; width: 100%; max-width: 500px; box-sizing: border-box;}
        .action-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; width: 100%; max-width: 500px;}
        .btn { padding: 12px 20px; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: background-color 0.2s; flex-grow: 1; font-family: 'Sarabun', sans-serif;}
        .btn-register { background: #10b981; display: none; }
        .btn-register:hover { background: #059669; }
        .btn-switch { background: #475569; }
        .btn-switch:hover { background: #334155; }
    </style>
</head>
<body>

    <h2 id="pageTitle">ระบบสแกนใบหน้า & QR Code</h2>
    <div id="camera-container">
        <video id="videoElement" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    
    <div id="statusMessage" class="status">กำลังโหลดระบบความแม่นยำสูง...</div>
    
    <div class="action-buttons">
        <button id="btnSwitch" class="btn btn-switch" onclick="switchCamera()">🔄 สลับกล้อง (หน้า/หลัง)</button>
        <button id="btnCapture" class="btn btn-register" onclick="captureAndRegister()">📸 บันทึกใบหน้านี้</button>
    </div>

    <script>
        const MATCH_THRESHOLD = 0.42; 

        const video = document.getElementById('videoElement');
        const overlay = document.getElementById('overlay');
        const statusMsg = document.getElementById('statusMessage');
        const btnCapture = document.getElementById('btnCapture');
        
        let currentMode = 'scan'; 
        let targetStudentId = '';
        let faceDescriptorsDB = []; 
        let lastMatchedId = '';
        let matchTimeout = null;
        const nameMap = new Map();

        let currentFacingMode = 'user'; 
        let isPlayEventAttached = false; 
        
        const offscreenCanvas = document.createElement('canvas');
        const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'register') {
            currentMode = 'register';
            targetStudentId = urlParams.get('studentId');
            document.getElementById('pageTitle').innerText = `ลงทะเบียนใบหน้า: รหัส ${targetStudentId}`;
            btnCapture.style.display = 'block'; 
        }

        async function loadModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
            try {
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                statusMsg.innerText = 'โหลด AI สำเร็จ กำลังเปิดกล้อง...';
                startCamera();
            } catch (err) {
                statusMsg.innerText = 'เกิดข้อผิดพลาด: ' + err.message;
            }
        }

        async function startCamera() {
            try {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;

                if (currentFacingMode === 'user') {
                    video.style.transform = 'scaleX(-1)';
                    overlay.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'scaleX(1)';
                    overlay.style.transform = 'scaleX(1)';
                }
            } catch (err) {
                statusMsg.innerText = 'ไม่สามารถเข้าถึงกล้องได้: ' + err.message;
            }
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera();
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            offscreenCanvas.width = video.videoWidth;
            offscreenCanvas.height = video.videoHeight;

            if (!isPlayEventAttached) {
                isPlayEventAttached = true;
                
                if (currentMode === 'register') {
                    statusMsg.innerText = 'กรุณามองกล้องให้ชัดเจน แล้วกดปุ่มบันทึก';
                } else {
                    if (!window.opener) {
                        statusMsg.innerHTML = '⚠️ ขาดการเชื่อมต่อกับระบบหลัก<br><span style="font-size: 0.9rem; font-weight: normal;">(หากเปิดในแอป LINE ให้กดปุ่ม 3 จุดมุมขวาบน เลือก "เปิดในเบราว์เซอร์อื่น")</span>';
                        statusMsg.style.backgroundColor = '#b91c1c';
                    } else {
                        statusMsg.innerText = 'สแกนใบหน้า หรือ QR Code...';
                    }
                    window.addEventListener('message', (event) => {
                        if (event.data && event.data.action === 'loadFaceData') {
                            event.data.faces.forEach(f => nameMap.set(f.studentId, f.studentName));
                            faceDescriptorsDB = event.data.faces.map(f => new faceapi.LabeledFaceDescriptors(f.studentId, [new Float32Array(Object.values(f.descriptor))]));
                            startScan(displaySize);
                        }
                    });
                    if (window.opener) window.opener.postMessage({ action: 'scannerReady' }, '*');
                }
            }
        });

        async function captureAndRegister() {
            btnCapture.disabled = true;
            statusMsg.innerText = 'กำลังประมวลผลใบหน้า...';
            statusMsg.style.backgroundColor = '#ca8a04';
            
            const options = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 });
            const detection = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();
            
            if (!detection) { 
                statusMsg.innerText = 'ไม่พบใบหน้า กรุณาให้หน้าอยู่ในกรอบและมีแสงสว่าง'; 
                statusMsg.style.backgroundColor = '#b91c1c';
                btnCapture.disabled = false; 
                return; 
            }
            if (window.opener) window.opener.postMessage({ action: 'faceRegistered', studentId: targetStudentId, descriptor: Array.from(detection.descriptor) }, '*');
            statusMsg.innerText = 'บันทึกเรียบร้อย! กำลังปิดหน้าต่าง...';
            statusMsg.style.backgroundColor = '#15803d';
            setTimeout(() => window.close(), 1500);
        }

        async function startScan(displaySize) {
            let faceMatcher = null;
            if (faceDescriptorsDB && faceDescriptorsDB.length > 0) {
                try { faceMatcher = new faceapi.FaceMatcher(faceDescriptorsDB, MATCH_THRESHOLD); } 
                catch(e) { console.warn("FaceMatcher Error:", e); }
            }
            
            let isDetecting = false;

            setInterval(async () => {
                if (isDetecting) return;
                isDetecting = true;

                try {
                    if (video.videoWidth > 0 && video.videoHeight > 0) {
                        offscreenCanvas.width = video.videoWidth;
                        offscreenCanvas.height = video.videoHeight;
                        offCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                        const imageData = offCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
                        
                        const qrCode = jsQR(imageData.data, imageData.width, imageData.height, { 
                            inversionAttempts: "attemptBoth" 
                        });

                        if (qrCode) {
                            const scannedId = qrCode.data.trim();
                            if (window.opener) window.opener.postMessage({ action: 'faceMatched', studentId: scannedId }, '*');
                            
                            if (lastMatchedId !== scannedId) {
                                lastMatchedId = scannedId;
                                const studentName = nameMap.get(scannedId) || `รหัส ${scannedId}`;
                                statusMsg.innerText = `✅ QR Code สำเร็จ: ${studentName}`;
                                statusMsg.style.backgroundColor = '#15803d';
                                
                                clearTimeout(matchTimeout);
                                matchTimeout = setTimeout(() => { statusMsg.innerText = 'สแกนใบหน้า หรือ QR Code...'; statusMsg.style.backgroundColor = '#0369a1'; lastMatchedId = ''; }, 2000);
                            }
                            isDetecting = false;
                            return; 
                        }
                    }

                    const options = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 });
                    const detections = await faceapi.detectAllFaces(video, options).withFaceLandmarks().withFaceDescriptors();
                    
                    const resizedDetections = faceapi.resizeResults(detections, displaySize);
                    const ctx = overlay.getContext('2d');
                    ctx.clearRect(0, 0, overlay.width, overlay.height);
                    
                    resizedDetections.forEach(detection => {
                        let matchLabel = 'unknown';
                        if (faceMatcher) {
                            const match = faceMatcher.findBestMatch(detection.descriptor);
                            matchLabel = match.label;
                        }
                        
                        const studentName = nameMap.get(matchLabel) || matchLabel;
                        const displayLabel = matchLabel !== 'unknown' ? studentName : 'Unknown';
                        
                        const box = detection.detection.box;

                        if (currentFacingMode === 'user') {
                            const drawBox = new faceapi.draw.DrawBox(box, { label: '' }); 
                            drawBox.draw(overlay);
                            ctx.save(); ctx.scale(-1, 1); ctx.font = 'bold 16px Sarabun';
                            const textWidth = ctx.measureText(displayLabel).width; const padding = 4; const flipX = -box.x - box.width; 
                            ctx.fillStyle = 'rgba(37, 99, 235, 0.9)'; ctx.fillRect(flipX, box.y - 24, textWidth + (padding * 2), 24);
                            ctx.fillStyle = '#ffffff'; ctx.fillText(displayLabel, flipX + padding, box.y - 6);
                            ctx.restore();
                        } else {
                            const drawBox = new faceapi.draw.DrawBox(box, { label: displayLabel }); 
                            drawBox.draw(overlay);
                        }

                        if (matchLabel !== 'unknown') {
                            if (window.opener) window.opener.postMessage({ action: 'faceMatched', studentId: matchLabel }, '*');
                            if (lastMatchedId !== matchLabel) {
                                lastMatchedId = matchLabel;
                                statusMsg.innerText = `✅ สแกนใบหน้าสำเร็จ: ${studentName}`;
                                statusMsg.style.backgroundColor = '#15803d';
                                clearTimeout(matchTimeout);
                                matchTimeout = setTimeout(() => { statusMsg.innerText = 'สแกนใบหน้า หรือ QR Code...'; statusMsg.style.backgroundColor = '#0369a1'; lastMatchedId = ''; }, 2000);
                            }
                        }
                    });
                } finally {
                    isDetecting = false; 
                }
            }, 300); 
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof faceapi === 'undefined') {
                statusMsg.innerText = 'โหลดไลบรารี AI ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ';
                statusMsg.style.backgroundColor = '#b91c1c';
            } else {
                loadModels();
            }
        });
    </script>
</body>
</html>
